<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFEFE0" />
    <!-- Installable app (PWA): required for push on iPhone, which only
         delivers web notifications to an app added to the Home Screen. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- GLB-02: versioned brand path (src/brand.js) so an old cached icon can never be reused. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/khoai-v2/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/khoai-v2/favicon-64.png" />
    <link rel="apple-touch-icon" href="/brand/khoai-v2/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hotel KHOAI" />
    <meta name="application-name" content="Hotel KHOAI" />
    <meta name="description" content="Order from your table at Hotel KHOAI" />
    <title>Hotel KHOAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script>try{if(localStorage.getItem("sohoj_theme")==="dark")document.documentElement.dataset.theme="dark";}catch(e){}</script>
  </head>
  <body>
    <!-- First paint before the JS bundle arrives (slow mobile data after a QR
         scan): a branded splash instead of a blank page. React replaces it. -->
    <style>
      .boot{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#FFEFE0;color:#5b3a24;font:600 15px/1.3 Inter,system-ui,sans-serif}
      .boot img{width:84px;height:84px;animation:bootp 1.2s ease-in-out infinite alternate}
      @keyframes bootp{from{transform:scale(.94);opacity:.75}to{transform:scale(1);opacity:1}}
      @media (prefers-reduced-motion:reduce){.boot img{animation:none}}
      :root[data-theme="dark"] .boot{background:#1A0F0B;color:#f3e2d3}
    </style>
    <div id="root"><div class="boot" role="status"><img src="/brand/khoai-v2/hk-mark-192.png" alt="" width="84" height="84" /><span>Opening the menu…</span></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
